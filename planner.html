<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Trip Planner | TravelVerse AI</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/planner.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>


<body>

<div class="container">

    <div class="planner-card">

        <h1>🌍 AI Smart Trip Planner</h1>

        <p>Create your dream trip in just a few clicks.</p>


        <form id="tripForm">


            <div class="input-box">

                <label>Destination</label>

                <input
                    type="text"
                    id="destination"
                    placeholder="Enter Destination"
                    required>

            </div>


            <div class="row">

                <div class="input-box">

                    <label>Start Date</label>

                    <input
                        type="date"
                        id="startDate"
                        required>

                </div>


                <div class="input-box">

                    <label>End Date</label>

                    <input
                        type="date"
                        id="endDate"
                        required>

                </div>

            </div>


            <div class="row">

                <div class="input-box">

                    <label>Budget (₹)</label>

                    <input
                        type="number"
                        id="budget"
                        placeholder="50000"
                        required>

                </div>


                <div class="input-box">

                    <label>Travellers</label>

                    <select id="travellers">

                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5+</option>

                    </select>

                </div>

            </div>


            <div class="input-box">

                <label>Trip Type</label>

                <select id="tripType">

                    <option>Solo</option>
                    <option>Family</option>
                    <option>Friends</option>
                    <option>Couple</option>
                    <option>Business</option>

                </select>

            </div>


            <div class="row">

                <div class="input-box">

                    <label>Transport</label>

                    <select id="transport">

                        <option>Flight</option>
                        <option>Train</option>
                        <option>Bus</option>
                        <option>Car</option>

                    </select>

                </div>


                <div class="input-box">

                    <label>Hotel</label>

                    <select id="hotel">

                        <option>3 Star</option>
                        <option>4 Star</option>
                        <option>5 Star</option>
                        <option>Luxury Resort</option>

                    </select>

                </div>

            </div>


            <div class="input-box">

                <label>Food Preference</label>

                <select id="food">

                    <option>Vegetarian</option>
                    <option>Non-Vegetarian</option>
                    <option>Vegan</option>

                </select>

            </div>


            <button type="submit" id="generateBtn">

                🤖 Generate AI Trip

            </button>


        </form>

    </div>

</div>


<script src="{{ url_for('static', filename='js/planner.js') }}"></script>

</body>

</html>
